# Course sandbox disallows persistent volume claims.
# Back up /data/db.sqlite3 before recreating the Pod; production needs durable storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dealership
  template:
    metadata:
      labels:
        app: dealership
    spec:
      containers:
        - name: dealership
          image: us.icr.io/sn-labs-johnsoncarl9/dealership:capstone-v1
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dealership-config
            - secretRef:
                name: dealership-secret
          env:
            - name: SQLITE_PATH
              value: /data/db.sqlite3
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
