name: Capstone CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r server/requirements.txt -r server/djangoapp/microservices/requirements.txt
      - name: Build React frontend
        working-directory: server/frontend
        run: npm ci && CI=true npm run build
      - name: Check migrations and test Django
        working-directory: server
        run: python manage.py makemigrations --check && python manage.py test
      - name: Test dealership API
        working-directory: server/database
        run: npm install && npm test
      - name: Test sentiment service
        working-directory: server/djangoapp/microservices
        run: python -m unittest test_app.py
